# Milestone 4: targeted (fidelity-focused) multitask generation.
# Same tasks, prompts, and validation as multilingual.toml, plus a [focus] mix that
# oversamples the failure modes found in the Milestone 3 benchmark: ambiguous technical
# terms, WARNING/CAUTION/NOTE labels, and negations/conditions.
#
# Derived from multilingual.toml:
# Every scenario is fictional. Changing this file changes config_sha256 on new records.
# Task weights cover the three teacher-generated tasks. With the default
# configs/sft/default.toml, identity (10%) and out-of-domain examples are added
# when the training set is prepared, so 40/30/20 here gives the 40/30/20/10 mix.
# Note: top-level keys must come before the first [table] in TOML.

seed = 20261120
source_template = "source_passage@2"
rewrite_template = "ste_rewrite@2"
data_license = "pending-rights-review"

# Fictional subjects. Do not add real part numbers or manufacturer names.
topics = [
    "the hydraulic reservoir of a fictional regional turboprop",
    "the nose landing gear steering actuator of a fictional business jet",
    "a fuel boost pump in the wing tank of a fictional cargo aircraft",
    "the cabin pressure outflow valve of a fictional airliner",
    "an engine oil filter on a fictional turbofan",
    "the wheel brake assembly of a fictional light aircraft",
    "a pitot-static probe heater on a fictional helicopter",
    "the emergency locator transmitter battery of a fictional airliner",
    "an air-conditioning pack heat exchanger on a fictional regional jet",
    "the passenger oxygen mask container of a fictional airliner",
    "a cargo door latch mechanism on a fictional freighter",
    "the main rotor blade damper of a fictional helicopter",
    "an engine fire detection loop of a fictional turboprop",
    "the windshield wiper motor of a fictional business jet",
    "a flap track roller assembly of a fictional airliner",
    "the auxiliary power unit starter of a fictional regional jet",
    "a potable water tank drain valve on a fictional airliner",
    "the anti-ice valve of a fictional turbofan engine inlet",
    "a lavatory smoke detector of a fictional airliner",
    "the propeller de-ice brush block of a fictional turboprop",
    "the static discharger wicks on the wing of a fictional airliner",
    "a cockpit display unit cooling fan of a fictional business jet",
    "the tail rotor gearbox chip detector of a fictional helicopter",
    "an engine bleed air precooler of a fictional regional jet",
    "the main landing gear tire of a fictional cargo aircraft",
    "a fuel quantity probe in the center tank of a fictional airliner",
    "the galley oven circuit breaker panel of a fictional airliner",
    "an evacuation slide pressure gauge of a fictional airliner",
    "the hydraulic hand pump of a fictional light helicopter",
    "an engine ignition exciter of a fictional turboprop",
    "the elevator trim tab actuator of a fictional business jet",
    "a hydraulic filter housing on a fictional regional jet",
    "the cockpit window heating controller of a fictional airliner",
    "an engine fuel nozzle of a fictional turboprop",
    "the brake temperature sensor of a fictional airliner",
    "a cabin air recirculation fan of a fictional regional jet",
    "the engine starter-generator of a fictional light helicopter",
    "an access panel on the lower fuselage of a fictional freighter",
    "a battery charger unit of a fictional business jet",
    "the ram air turbine release mechanism of a fictional airliner",
    "a nitrogen-charged accumulator of a fictional cargo aircraft",
    "the engine mount bolts of a fictional turboprop",
    "a pressure relief valve of a fictional helicopter gearbox",
    "the landing light assembly of a fictional regional jet",
    "a fire extinguisher bottle squib of a fictional airliner",
    "the yaw damper servo of a fictional business jet",
    "an oil pressure transmitter of a fictional turbofan",
    "the seat track fittings of a fictional airliner cabin",
    "a de-icing boot on the wing leading edge of a fictional turboprop",
    "the fuel shutoff valve actuator of a fictional regional jet",
]

audiences = [
    "a licensed aircraft maintenance technician",
    "an apprentice mechanic under supervision",
    "a line maintenance technician working at night",
]

sentence_counts = [3, 4, 5, 6]

[tasks]
translation_languages = ["de", "fr", "ro"]
requirement_languages = ["en", "de", "fr", "ro"]

[tasks.weights]
plain_to_ste_rewrite = 0.4
multilingual_to_ste_translation = 0.3
requirements_to_ste = 0.2

# Source-stage format guidance ($format_guidance in source_passage@2).
[tasks.source_formats]
plain_to_ste_rewrite = """
Ordinary prose, written like a busy engineer before editing: long sentences, passive voice,
words ending in -ing, vague words, and several actions in one sentence are all acceptable.
Someone will rewrite this text later."""
multilingual_to_ste_translation = """
Ordinary prose, written like a busy engineer before editing: long sentences, passive voice,
vague words, and several actions in one sentence are all acceptable. Someone will translate
and rewrite this text later."""
requirements_to_ste = """
Structured technical information, not prose: short 'key: value' lines and bullet points,
for example the component, the preconditions, the required actions as facts, limits with
units, the tools, and the safety constraints. Do not write complete instructions; a writer
will turn this information into a document later."""

# Rewrite-stage task instruction ($task_instruction in ste_rewrite@2).
[tasks.instructions]
plain_to_ste_rewrite = "Rewrite the English input text into STE-oriented English."
multilingual_to_ste_translation = """
The input text is in {language}. Translate it directly into English and write the English
text in STE. Do not keep any {language} words, except identifier codes."""
requirements_to_ste = """
The input is structured technical information in {language}. Write it as an English STE
{category} text in complete sentences. Do not copy the 'key: value' layout: write
instructions in the command form and descriptions as short sentences, in a logical order.
Use only the information in the input. Do not add steps, values, or safety statements."""

[sampling.source]
temperature = 0.9
top_p = 0.95
max_tokens = 900

[sampling.rewrite]
temperature = 0.2
top_p = 0.9
max_tokens = 1000

[request]
timeout_s = 180
max_attempts = 3
initial_backoff_s = 1.0
max_backoff_s = 30.0
max_consecutive_failures = 5

[validation]
max_words_procedural = 20
max_words_descriptive = 25
min_length_ratio = 0.3
max_length_ratio = 3.0

[[categories]]
name = "procedure"
weight = 0.4
guidance = "Step-by-step maintenance instructions, for example removal, installation, inspection, or servicing."

[[categories]]
name = "description"
weight = 0.25
guidance = "A description of how a component or system is built and how it operates."

[[categories]]
name = "safety_notice"
weight = 0.15
guidance = "One or two WARNING or CAUTION notices, each with the hazard and how to avoid it, followed by the related task step."

[[categories]]
name = "troubleshooting"
weight = 0.2
guidance = "A fault symptom, its possible causes, and the checks to isolate the cause, in order."

# --- Targeted failure modes (Milestone 4) ---------------------------------------
# Options are '|'-separated; parts are {o0}, {o1}, ... in source/rewrite/label_guidance.
# The terminology mappings are context dependent and are not universal translations.
[focus]
none_weight = 0.0

[focus.specs.terminology]
weight = 0.40
tasks = ["multilingual_to_ste_translation", "requirements_to_ste"]
required_part = 2
source = """
Use the {language} term '{o0}' at least once, in this meaning: {o1}. Use the term
naturally, together with identifier codes, quantities, and values with units."""
rewrite = """
In this input, '{o0}' means {o1}. Write it in English as '{o2}'. Do not translate it
with another meaning of the word."""

[focus.specs.terminology.options]
de = [
    "Mutter|a threaded nut on a bolt or stud (not a person)|nut",
    "Sicherungsmutter|a self-locking nut|nut",
    "Dichtung|a seal between two parts|seal",
    "Flachdichtung|a flat gasket between two flanges|gasket",
    "lösen|to loosen a nut or bolt by turning it, without removing it|loosen",
    "lösen|to disconnect an electrical connector|disconnect",
    "Maulschlüssel|an open-end wrench with a size in mm|wrench",
    "Schlüssel|the key of a lock on a cabinet or panel|key",
    "Deckel|a cover over an opening|cover",
    "Leitung|a hydraulic line, a tube that carries fluid|line",
    "Druckluft|compressed air from a shop air supply|compressed air",
    "Schraube|a bolt that is used with a nut|bolt",
]
fr = [
    "à mains nues|with bare hands, without gloves|bare hands",
    "écrou|a threaded nut|nut",
    "joint torique|an O-ring seal|O-ring",
    "clé dynamométrique|a torque wrench|torque wrench",
    "vis|a screw|screw",
    "desserrer|to loosen a fastener|loosen",
    "débrancher|to disconnect an electrical connector|disconnect",
    "rondelle|a washer|washer",
]
ro = [
    "panou|an access panel|panel",
    "șurub|a screw|screw",
    "șurub|a bolt that is used with a nut|bolt",
    "piuliță|a threaded nut|nut",
    "garnitură|a seal or gasket between two parts|seal",
    "cheie dinamometrică|a torque wrench|torque wrench",
    "conector|an electrical connector|connector",
    "slăbiți|to loosen a fastener (imperative)|loosen",
]

[focus.specs.safety_label]
weight = 0.30
source = "Make the safety notice essential to the task."
label_guidance = """
The text must contain exactly this safety labelling: {o0}, each label in upper case at
the start of its notice. A WARNING is about a risk of injury to persons, a CAUTION is
about a risk of damage to equipment, and a NOTE gives information only. Use no other
safety labels."""
rewrite = """
Keep every safety label exactly as in the input; in English the labels are: {o1}.
Do not change a CAUTION to a WARNING or a WARNING to a CAUTION. Write NOTE for a note."""

[focus.specs.safety_label.options]
en = ["CAUTION|CAUTION", "CAUTION|CAUTION", "NOTE|NOTE", "WARNING|WARNING", "one CAUTION and one NOTE|CAUTION, NOTE", "one WARNING and one CAUTION|WARNING, CAUTION"]
de = ["VORSICHT|CAUTION", "VORSICHT|CAUTION", "HINWEIS|NOTE", "WARNUNG|WARNING", "one VORSICHT and one HINWEIS|CAUTION, NOTE", "one WARNUNG and one VORSICHT|WARNING, CAUTION"]
fr = ["ATTENTION|CAUTION", "ATTENTION|CAUTION", "REMARQUE|NOTE", "AVERTISSEMENT|WARNING", "one ATTENTION and one REMARQUE|CAUTION, NOTE", "one AVERTISSEMENT and one ATTENTION|WARNING, CAUTION"]
ro = ["ATENȚIE|CAUTION", "ATENȚIE|CAUTION", "NOTĂ|NOTE", "AVERTISMENT|WARNING", "one ATENȚIE and one NOTĂ|CAUTION, NOTE", "one AVERTISMENT and one ATENȚIE|WARNING, CAUTION"]

[focus.specs.negation_condition]
weight = 0.30
source = """
Include at least one prohibition (in {language}, the equivalent of '{o0}') and at least
one condition or sequence dependency (the equivalent of '{o1}'). Both must be essential
to safety or to the correct order of the work."""
rewrite = """
Keep every prohibition as a prohibition (for example 'Do not ...'). Never turn a
prohibition into a command to do the prohibited action. Keep every condition
('{o1}' and others) attached to the same action, and keep the order of the steps."""

[focus.specs.negation_condition.options]
any = [
    "do not|before",
    "must not|only when",
    "never|after",
    "do not|unless",
    "do not|while",
    "must not|if",
    "never|only when",
    "do not|after",
    "must not|before",
    "do not|unless",
]
