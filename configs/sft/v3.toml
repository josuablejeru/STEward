# SFT set v3 (Milestone 4): targeted fidelity data plus the Milestone 3 data, filtered with
# prelint-3 and an independent LLM critique (steward dataset prepare --config configs/sft/v3.toml).
# Derived from configs/sft/default.toml.
# The out-of-domain requests below are hand-written for training only. The benchmark
# suite has its own, different out-of-domain items; never copy between them.
seed = 20261108
prompt = "ste_only@1"
# Milestone 3 brief: 10%. (data/sft/v1 used 0.12; its manifest keeps that config.)
validation_fraction = 0.10
enforce_mix = true
require_rule_pass = true
near_duplicate_threshold = 0.85
# Milestone 4 additions.
require_llm_review = true          # exclude examples without a passed independent critique
max_warning_caution_ratio = 1.5    # v2 had about 3.6 WARNING targets per CAUTION target
prefer_focus = true                # keep targeted examples first when a task is down-sampled
# Out-of-domain examples as a share of the in-domain examples (an assumption:
# the task brief gives only the four in-domain shares).
out_of_domain_fraction = 0.06

# Shares of the in-domain examples. They are normalized.
[mix]
plain_to_ste_rewrite = 0.4
multilingual_to_ste_translation = 0.3
requirements_to_ste = 0.2
ste_identity = 0.1

[validation]
max_words_procedural = 20
max_words_descriptive = 25
min_length_ratio = 0.3
max_length_ratio = 3.0

