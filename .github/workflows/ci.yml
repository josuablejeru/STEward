name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.70.2  # must match the Pixi that wrote pixi.lock
          environments: default
          locked: true
      - name: Check lockfile is up to date
        run: pixi lock --check
      - name: Format, lint, type check, tests, benchmark verification
        run: pixi run check
