# Benchmark candidates. Each entry is one (model, prompt, role) combination.
#
# role:
#   base       untuned model with the minimal prompt (baseline 1)
#   prompted   untuned model with the full STE guidance prompt
#   finetuned  STEward fine-tuned checkpoint (served for evaluation)
#   quantized  quantized export of a finetuned checkpoint
#   release    a published STEward release (set release_version)
#
# parameter_count is read from the provider when not given here.
#
# suite: directory under benchmarks/golden/ (default ste-golden-v0, the JSON
# rewrite contract). primary_suite is used for model selection and the README.

primary_suite = "ste-multilingual-v1"

[[candidates]]
id = "qwen3-1.7b-base"
role = "base"
provider = "ollama"
model = "qwen3:1.7b"
base_model = "Qwen/Qwen3-1.7B"
prompt = "benchmark_minimal@1"
think = false

[[candidates]]
id = "qwen3-1.7b-prompted"
role = "prompted"
provider = "ollama"
model = "qwen3:1.7b"
base_model = "Qwen/Qwen3-1.7B"
prompt = "ste_rewrite@1"
think = false

