[workspace]
name = "steward"
version = "0.1.0"
description = "STE-oriented technical documentation tooling (ASD-STE100 Issue 9 reference)."
channels = ["conda-forge"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# Default feature: runtime only (Python + the steward package, editable).
# ---------------------------------------------------------------------------
[dependencies]
python = "3.12.*"

[pypi-dependencies]
steward = { path = ".", editable = true }

[tasks]
steward = { cmd = "steward", description = "Run the steward CLI" }

# ---------------------------------------------------------------------------
# Dev feature: formatting, linting, type checking, testing.
# ---------------------------------------------------------------------------
[feature.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"

[feature.dev.tasks]
format = { cmd = "ruff format src tests && ruff check --fix --select I src tests", description = "Format code with Ruff" }
format-check = { cmd = "ruff format --check src tests", description = "Check formatting without changes" }
lint = { cmd = "ruff check src tests", description = "Lint with Ruff" }
typecheck = { cmd = "mypy", description = "Type check with mypy (strict)" }
test = { cmd = "pytest", description = "Run the CPU-only test suite" }
test-cov = { cmd = "pytest --cov=steward --cov-report=term-missing", description = "Run tests with coverage" }
check = { depends-on = ["format-check", "lint", "typecheck", "test"], description = "Run all CI checks" }

# ---------------------------------------------------------------------------
# CUDA feature: GPU training stack (Linux only). Training is not implemented
# yet; this environment exists so the GPU stack is pinned and reproducible.
# RTX 5090 (Blackwell, sm_120) needs CUDA >= 12.8.
# ---------------------------------------------------------------------------
[feature.cuda.system-requirements]
cuda = "12.8"

[feature.cuda.dependencies]
cuda-version = ">=12.8,<13"
pytorch-gpu = ">=2.7"

[feature.cuda.tasks]
cuda-info = { cmd = "python -c \"import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda, 'available', torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no GPU')\"", description = "Report the PyTorch/CUDA setup" }

[environments]
default = { features = ["dev"], solve-group = "default" }
cuda = { features = ["dev", "cuda"], solve-group = "cuda" }
